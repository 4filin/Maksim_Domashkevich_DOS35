<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список пользователей</title>
</head>
<body>
    <h1>Наши пользователи</h1>
    <ul>
        {% for user in users %}
        <li>
            <strong>Имя:</strong> {{ user.name }}<br>
            <strong>Email:</strong> {{ user.email }}
        </li>
        {% endfor %}
    </ul>
</body>
</html>
